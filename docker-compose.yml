services:

  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: openreply
      POSTGRES_USER: openreply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreply -d openreply"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: Dockerfile

    restart: "no"

    environment:
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - sh
      - -c
      - npm run db:migrate


  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production

      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}

      COMMENT_POLL_INTERVAL_MS: ${COMMENT_POLL_INTERVAL_MS:-300000}
      COMMENT_POLL_MAX_PER_SWEEP: ${COMMENT_POLL_MAX_PER_SWEEP:-30}
      COMMENT_POLL_LOOKBACK_HOURS: ${COMMENT_POLL_LOOKBACK_HOURS:-72}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "3000:3000"

    command:
      - sh
      - -c
      - |
        npm run db:migrate
        npm start


  worker:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production

      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}

      COMMENT_POLL_INTERVAL_MS: ${COMMENT_POLL_INTERVAL_MS:-300000}
      COMMENT_POLL_MAX_PER_SWEEP: ${COMMENT_POLL_MAX_PER_SWEEP:-30}
      COMMENT_POLL_LOOKBACK_HOURS: ${COMMENT_POLL_LOOKBACK_HOURS:-72}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - npm
      - run
      - worker


  cron:
    image: alpine:3.22
    restart: unless-stopped

    environment:
      CRON_SECRET: ${CRON_SECRET}
      WEB_INTERNAL_URL: http://web:3000

    depends_on:
      web:
        condition: service_started

    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl

        echo "OpenReply cron scheduler started"

        while true; do

          HOUR=$$(date -u +%H)
          MINUTE=$$(date -u +%M)

          # Token refresh — daily at 05:00 UTC
          if [ "$$HOUR" = "05" ] && [ "$$MINUTE" = "00" ]; then
            echo "Running token refresh..."
            curl -fsS \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              "$${WEB_INTERNAL_URL}/api/cron/refresh-tokens" || true
          fi

          # Attach next reel — daily at 06:00 UTC
          if [ "$$HOUR" = "06" ] && [ "$$MINUTE" = "00" ]; then
            echo "Running next-reel attachment..."
            curl -fsS \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              "$${WEB_INTERNAL_URL}/api/cron/attach-next-reel" || true
          fi

          # Follower snapshot — daily at 07:00 UTC
          if [ "$$HOUR" = "07" ] && [ "$$MINUTE" = "00" ]; then
            echo "Running follower snapshot..."
            curl -fsS \
              -H "Authorization: Bearer $${CRON_SECRET}" \
              "$${WEB_INTERNAL_URL}/api/cron/snapshot-followers" || true
          fi

          sleep 60

        done


volumes:
  pgdata:
  redisdata:
